name: Build plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint PHP
        run: php -l traccar-map.php

      - name: Build ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/traccar-map
          cp traccar-map.php readme.txt LICENSE.txt dist/traccar-map/
          perl -pi -e "s/^ \* Version:.*/ * Version: $VERSION/" dist/traccar-map/traccar-map.php
          perl -pi -e "s/^Stable tag:.*/Stable tag: $VERSION/" dist/traccar-map/readme.txt
          cd dist
          zip -r traccar-map.zip traccar-map

      - name: Check packaged plugin
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/traccar-map

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: traccar-map
          path: dist/traccar-map.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/traccar-map.zip --generate-notes

      - name: Publish to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: tananaev
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: traccar-map
          BUILD_DIR: dist/traccar-map
